<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact White Water Rafting Company for questions, reservations, or general inquiries about our trips">
    <meta name="author" content="Oscar Canelon">
    <title>Contact Us | White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="wwr logo oars">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h2>White Water Rafting Company</h2>
            <address>
            <p>Address: 123 River Rapids Way, Ocoee, TN 37361</p>
            <p>Phone: +1 (555) 987-6543</p>
            <p>Email: info@whitewaterrafting.com</p>
            </address>
        </section>
        <div class="contact-layout">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2945.7549814472864!2d1.1290354772708429!3d42.41166223183826!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a605dec692e217%3A0x59af785b36b4b182!2sLa%20Rafting%20Company!5e0!3m2!1sen!2sve!4v1791398588434!5m2!1sen!2sve" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">

                    <p>Purpose of Message:</p>

                    <input type="radio" id="inquiry" name="purpose" value="general">
                    <label for="inquiry">General Inquiry</label> <br>

                    <input type="radio" id="Reservation" name="purpose" value="Reservation Question">
                    <label for="Reservation">Reservation Question</label> <br>  

                    <input type="radio" id="Website" name="purpose" value="Website Suggestion">
                    <label for="Website">Website Suggestion</label> <br>
                    
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>  

                    <label for="checkbox">Please subscribe me to the monthly newsletter</label>
                    <input type="checkbox" id="checkbox" name="checkbox">


                    <button type="submit">Submit</button>
            </form>
        </div>
    <section class="employees">
        <h2>We Are Here to Serve You</h2>

        <div class="employee-grid">
            <figure>
                <img src="images/employee1.webp" alt="Photo of Jane">
                <figcaption>Jane Doe - Tour Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.webp" alt="Photo of John">
                <figcaption>John Doe - Tour Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp" alt="Photo of Mary">
                <figcaption>Mary Sue - Tour Guide</figcaption>
            </figure>
        </div>
    </section>

    </main>
    
    <footer>
        <p>© 2026 White Water Rafting Company Oscar Canelon </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/face.png" alt="Facebook icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linke.png" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/insta.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
    
</body>
</html>
