<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    
    <h1>☑ Basic HTML and CSS Quiz</h1>
    <form>      
        <label for="q1">1. What does HTML stand for?</label>
        <input type="text" name="q1" id="q1">
        <label for="q2">2. Explain the main difference between HTML and CSS</label>
        <textarea name="q2" id="q2"></textarea>
        <label for="q3">3. Which of the following is a CSS framework?</label>
        <select name="q3" id="q3">
            <option value="" selected disabled> Choose One</option>
            <option value="bootstrap">Bootstrap</option>
            <option value="react">React</option>
            <option value="python">Python</option>
        </select>
        <label for="q4">4. How many levels of headings does HTML have?</label>
        <input type="number" name="q4" id="q4">
        <button type="submit">Submit Quiz</button>
      
    </form>
</body>
</html>
